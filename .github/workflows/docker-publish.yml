name: Build and push Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack (docker compose)
        run: docker compose up -d --build

      - name: Wait for gateway to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7014/health > /dev/null; then
              echo "Gateway healthy"; exit 0
            fi
            echo "Waiting for gateway... ($i/30)"; sleep 5
          done
          echo "Gateway did not become healthy in time"
          docker compose ps
          docker compose logs
          exit 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run integration tests against the live stack
        run: dotnet test Tests/MicroCommerce.IntegrationTests --logger "console;verbosity=normal"
        env:
          GATEWAY_URL: http://localhost:7014

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: catalog-api,   context: .,        dockerfile: Catalog.API/Dockerfile }
          - { name: basket-api,    context: .,        dockerfile: Basket.API/Dockerfile }
          - { name: identity-api,  context: .,        dockerfile: Identity.API/Dockerfile }
          - { name: ordering-api,  context: .,        dockerfile: Ordering.API/Dockerfile }
          - { name: messages-api,  context: .,        dockerfile: Messages.API/Dockerfile }
          - { name: gateway,       context: .,        dockerfile: OcelotGateway/Dockerfile }
          - { name: frontend,      context: frontend, dockerfile: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/microcommerce-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/microcommerce-${{ matrix.name }}:${{ github.sha }}
          # Frontend'e gateway adresi build sirasinda gomulur (repo Variables > GATEWAY_URL)
          build-args: |
            REACT_APP_GATEWAY=${{ vars.GATEWAY_URL || 'http://localhost:7014' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
